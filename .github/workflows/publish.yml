# Publish autorun to TestPyPI, then PyPI.
#
# One distribution. The pdf-extractor plugin is a plugin in every harness — its
# own plugin.json, commands and skill — but it is not a separate package: its
# code ships inside this wheel as `pdf_extraction`, behind the `pdf` extra.
#
# Authentication is Trusted Publishing (OIDC): no API token is stored anywhere.
# The project must be registered on each index BEFORE its first publish, and a
# project that does not exist yet is registered as a *pending* publisher.
# https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
#
# Register both of these (one project x two indexes) with:
#   Owner: ahundt   Repository: autorun   Workflow: publish.yml
#   Environment: testpypi (on test.pypi.org) or pypi (on pypi.org)
#
#   test.pypi.org/manage/account/publishing/  -> autorun-ai
#   pypi.org/manage/account/publishing/       -> autorun-ai
#
# The project name is `autorun-ai`, not `autorun`: PyPI refuses the bare name
# ("This project name isn't allowed"), so registering that one registers
# nothing. The repository stays `autorun`.
#
# Two ways to run:
#   1. workflow_dispatch -> builds and publishes to TestPyPI only. Use this to
#      prove the setup works without creating anything permanent on PyPI.
#   2. push of a v* tag  -> full CI, then TestPyPI, then PyPI.
#
# Actions are pinned to full commit SHAs; test_documentation_consistency.py
# ::test_ci_actions_are_pinned_to_full_commits fails the build otherwise.

name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      testpypi_only:
        description: 'Publish to TestPyPI only (leave checked until PyPI is proven)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    # A tag push republishes whatever the tag points at, which may not be the
    # commit CI last ran on. Gate on a fresh run rather than trusting history.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  build:
    needs: test
    # needs.test is skipped on workflow_dispatch; without this the whole job
    # would be skipped with it.
    if: always() && (needs.test.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # The artifact builder guarantees repeatable bytes only within one
          # toolchain. Pin uv so a later tag run cannot silently use a newer
          # archive writer than the workflow-dispatch rehearsal.
          version: '0.12.19'
          python-version: '3.12'

      - name: Verify the tag matches the declared version
        # Only a tag carries a version to check. A dispatch run builds whatever
        # the branch declares, which is the point of a TestPyPI rehearsal.
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          declared=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('plugins/autorun/pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$declared" ]; then
            echo "Tag v$tag_version does not match plugins/autorun version $declared"
            exit 1
          fi
          echo "autorun $declared matches tag v$tag_version"

      - name: Build sdist and wheel
        # This wrapper derives SOURCE_DATE_EPOCH from the commit and normalizes
        # the sdist. Rehearsal and tag runs at one SHA must build the same bytes
        # because the TestPyPI digest check below deliberately rejects drift.
        run: uv run --no-project python scripts/build_release_artifacts.py --out-dir dist

      - name: Verify one wheel carries both packages and both entry points
        # The pdf plugin has no pyproject of its own, so nothing else would
        # notice if setuptools stopped collecting `pdf_extraction` or a second
        # distribution reappeared. Publishing either mistake is permanent.
        run: |
          uv run --no-project python - <<'PY'
          import pathlib, tomllib, zipfile
          # PEP 427 normalises "-" to "_" in wheel filenames. Derive that stem
          # from the declared distribution instead of spelling it: a written-out
          # `autorun_ai` is a second name to keep in sync, and this is the worst
          # place to discover a mismatch, since the job asserts after the build
          # it is guarding.
          distribution = tomllib.load(
              open("plugins/autorun/pyproject.toml", "rb")
          )["project"]["name"]
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          assert [w.name.split("-")[0] for w in wheels] == [
              distribution.replace("-", "_")
          ], (wheels, distribution)
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              entry = next(n for n in names if n.endswith(".dist-info/entry_points.txt"))
              scripts = archive.read(entry).decode()
              meta = archive.read(
                  next(n for n in names if n.endswith(".dist-info/METADATA"))
              ).decode()
          assert "pdf_extraction/cli.py" in names, "pdf_extraction is missing from the wheel"
          for script in ("autorun =", "autorun-install =", "extract-pdfs ="):
              assert script in scripts, f"{script} missing:\n{scripts}"
          for extra in ("pdf", "pdf-gpu", "pdf-llm", "pdf-progress"):
              assert f"Provides-Extra: {extra}" in meta, f"extra {extra} missing"
          print(wheels[0].name, "carries pdf_extraction, extract-pdfs and the pdf extras")
          PY

      - name: Check the metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Upload the built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-autorun
          path: dist/

  publish-testpypi:
    needs: build
    # `test` is skipped on a dispatch run, and a skipped job propagates down the
    # whole needs graph, not just to its direct dependents. `build` overrides
    # that with `always()`; this job did not, so the rehearsal skipped its only
    # publishing step and the run still reported success -- a green rehearsal
    # that uploaded nothing and proved nothing about trusted publishing. State
    # the real precondition instead of inheriting one.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-autorun
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rerun of the same tag would otherwise fail on files TestPyPI
          # already has. PyPI below stays strict.
          skip-existing: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Keep the installer semantics fixed with the artifact toolchain.
          version: '0.12.19'
          python-version: '3.12'
      - name: Install the rehearsed distribution from TestPyPI and run its CLI
        # An accepted upload is a weaker property than an installable wheel, and
        # the difference is what a rehearsal exists to catch -- the next job
        # writes to PyPI, where a version is immutable and a bad wheel costs a
        # new version rather than a re-upload.
        #
        # The version comes from the built wheel, not from `${GITHUB_REF_NAME#v}`:
        # this job also runs on `workflow_dispatch`, where the ref name is the
        # branch and that expression would ask TestPyPI for `autorun-ai==main`.
        #
        # Select the candidate by its exact TestPyPI URL and compare TestPyPI's
        # recorded digest with the file built by this run. A dual-index package
        # requirement is ambiguous under uv's first-index policy: PyPI already
        # carries this distribution, so uv can stop there without considering
        # the candidate on TestPyPI. `unsafe-best-match` would make both indexes
        # equally trusted, which is broader than this verification needs. A
        # direct candidate URL plus PyPI for dependencies proves the uploaded
        # bytes while retaining uv's safe index policy for every dependency.
        #
        # TestPyPI's metadata API trails the upload by seconds, hence the retry.
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          wheel_name=$(basename "$wheel")
          sdist_name=$(basename "$sdist")
          version=$(basename "$wheel" | cut -d- -f2)
          echo "rehearsing autorun-ai==${version}"
          metadata="${RUNNER_TEMP}/testpypi-${version}.json"
          ready=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              "https://test.pypi.org/pypi/autorun-ai/${version}/json" \
              --output "$metadata" && \
              python3 - "$metadata" "$version" "$wheel_name" "$sdist_name" <<'PY'
          import json
          import sys

          path, version, wheel_name, sdist_name = sys.argv[1:]
          document = json.load(open(path, encoding="utf-8"))
          assert document["info"]["version"] == version
          live = [item for item in document["urls"] if not item["yanked"]]
          assert [item["filename"] for item in live].count(wheel_name) == 1
          assert [item["filename"] for item in live].count(sdist_name) == 1
          PY
            then
              ready=true
              break
            fi
            echo "attempt ${attempt} failed; TestPyPI metadata may still be catching up"
            sleep 20
          done
          test "$ready" = true

          metadata_values=$(python3 - "$metadata" "$wheel_name" "$sdist_name" <<'PY'
          import json
          import sys

          path, wheel_name, sdist_name = sys.argv[1:]
          items = {item["filename"]: item for item in json.load(open(path, encoding="utf-8"))["urls"]}
          wheel = items[wheel_name]
          sdist = items[sdist_name]
          print(wheel["url"], wheel["digests"]["sha256"], sdist["url"], sdist["digests"]["sha256"], sep="\t")
          PY
          )
          IFS=$'\t' read -r wheel_url wheel_index_sha sdist_url sdist_index_sha <<< "$metadata_values"
          wheel_sha=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$wheel")
          sdist_sha=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$sdist")
          test "$wheel_sha" = "$wheel_index_sha"
          test "$sdist_sha" = "$sdist_index_sha"

          export AUTORUN_HOME="${RUNNER_TEMP}/ar-home"
          test "$(uv run --isolated --no-project --index-url https://pypi.org/simple/ \
            --with "autorun-ai @ ${wheel_url}" autorun --version)" = "autorun ${version}"
          uv run --isolated --no-project --index-url https://pypi.org/simple/ \
            --with "autorun-ai[pdf] @ ${wheel_url}" extract-pdfs --list-backends
          UV_NO_CACHE=1 uv run --isolated --no-project --index-url https://pypi.org/simple/ \
            --with "autorun-ai @ ${sdist_url}" \
            python -c "import autorun, pdf_extraction; assert autorun.__version__ == '${version}'"

  publish-pypi:
    needs: publish-testpypi
    # Never reachable from a dispatch run: the event check alone excludes it, so
    # the rehearsal cannot publish to the real index even if its input changes.
    # The TestPyPI result is named rather than inherited for the same reason as
    # above -- the job it needs now carries its own condition, and PyPI must
    # never be reached from a rehearsal that did not actually upload.
    # Bracket notation because a hyphenated job id is not a bare property name.
    if: >-
      ${{ !cancelled()
      && needs['publish-testpypi'].result == 'success'
      && github.event_name == 'push'
      && inputs.testpypi_only != true }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-autorun
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
