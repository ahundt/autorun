name: autorun CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        # setup-uv@v7 is the current recommended version per official uv docs.
        # python-version here replaces actions/setup-python -- setup-uv handles both.
        # enable-cache speeds up installs by caching the uv cache between runs.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Bun for the OpenCode bridge contract
        # OpenCode executes autorun's in-process veto under Bun. The official
        # action makes those tests a release gate instead of optional skips.
        uses: oven-sh/setup-bun@v2

      - name: Verify Python version
        run: |
          uv run --project plugins/autorun python --version
          echo "Expected: Python ${{ matrix.python-version }}"

      - name: Install dependencies
        # Select autorun explicitly; the workspace root package has no runtime
        # or test dependencies. --locked reproduces the committed uv.lock.
        # --dev installs autorun's [dependency-groups] dev requirements:
        #   pytest>=8.4.2, pytest-asyncio>=1.2.0, pytest-cov>=7.0.0, pytest-mock>=3.15.1,
        #   pytest-timeout>=2.1.0 (plugin pyproject.toml:165-172).
        # --all-extras also installs [project.optional-dependencies] extras (compatible pins).
        run: uv sync --project plugins/autorun --locked --dev --all-extras

      - name: Lint - critical errors only (blocking)
        # E9: syntax errors, F63/F7/F82: undefined names/imports -- these always fail CI
        run: uvx ruff check --select E9,F63,F7,F82 .

      # TODO: enable ruff format --check as a blocking step once the codebase has been
      # uniformly formatted. The code was not written with ruff format -- 150 of 153
      # files need reformatting. Run `uvx ruff format .` in a dedicated commit when ready.
      # Suggested step to uncomment:
      #   - name: Lint - format check (blocking)
      #     run: uvx ruff format --check .

      - name: Lint - full check (non-blocking)
        # Style and other issues reported but do not fail CI
        run: uvx ruff check --exit-zero .

      - name: Run unit tests
        # Run from plugins/autorun/ so pytest discovers plugins/autorun/pyproject.toml
        # for asyncio_mode, markers, timeout config (not the workspace root pyproject.toml).
        # Tests live at plugins/autorun/tests/ -- running from repo root finds nothing.
        # --junitxml uses absolute workspace path so dorny/test-reporter finds the XML.
        # Hermetic daemon, subprocess, race, and slow tests are part of the
        # release gate. Only real tmux sessions and opt-in live/model tests are
        # excluded from the cross-platform matrix. Release artifact builds run
        # once in the dedicated job below.
        # Coverage is measured once in the dedicated Ubuntu job below so the
        # seven-platform matrix does not pay instrumentation cost seven times.
        working-directory: plugins/autorun
        run: >-
          uv run --project . pytest tests/
          -m "not tmux and not e2e and not release"
          --tb=short -v
          --junitxml=${{ github.workspace }}/test_results_${{ matrix.os }}_py${{ matrix.python-version }}.xml

      - name: Publish test results
        # dorny/test-reporter: 1.1k stars, updated 2026, pure Node.js (no Docker).
        # Works on Linux, macOS, and Windows (pure Node.js, no Docker required).
        # reporter: java-junit parses the JUnit XML that pytest --junitxml generates.
        # fail-on-error: false prevents publishing from independently failing the job.
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: "autorun Tests (${{ matrix.os }}, py${{ matrix.python-version }})"
          path: test_results*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Run PDF extractor tests
        # Skipped on 3.14: markitdown requires magika <0.7, whose Windows
        # dependency caps onnxruntime at 1.20.1; that release has no cp314
        # wheel. Newer onnxruntime releases support cp314 but cannot satisfy
        # magika's cap. Remove the condition when markitdown permits a compatible
        # magika/onnxruntime pair. Autorun's own tests still run above.
        if: matrix.python-version != '3.14'
        working-directory: plugins/pdf-extractor
        run: uv run --project . --locked --extra dev pytest tests/ --tb=short -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Bun for the OpenCode bridge contract
        uses: oven-sh/setup-bun@v2

      - name: Install test dependencies
        run: uv sync --project plugins/autorun --locked --dev --all-extras

      - name: Enforce source coverage
        working-directory: plugins/autorun
        run: >-
          uv run --project . pytest tests/
          -m "not tmux and not e2e and not release"
          --tb=short
          --cov=src/autorun
          --cov-report=term-missing
          --cov-fail-under=75

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --project plugins/autorun --locked --dev --all-extras

      - name: Build twice and verify artifact lifecycles
        working-directory: plugins/autorun
        run: >-
          uv run --project . pytest tests/test_release_artifacts.py
          -m release --tb=short -v

  tmux-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install test dependencies and tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          uv sync --project plugins/autorun --locked --dev

      - name: Run tests against a private tmux server
        working-directory: plugins/autorun
        run: >-
          uv run --project . pytest tests/
          -m tmux --tb=short -v

  state-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --project plugins/autorun --locked --dev

      - name: Verify storage cost remains independent of unrelated state
        working-directory: plugins/autorun
        env:
          AUTORUN_ENABLE_STATE_BENCHMARK: "1"
        run: >-
          uv run --project . pytest tests/test_state_store_benchmark.py
          -m benchmark --tb=short -v
