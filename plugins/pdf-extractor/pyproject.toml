[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extractor"
version = "1.0.0rc1"
description = "PDF data extraction with 9 backend support"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Andrew Hundt", email = "ATHundt@gmail.com"}]
keywords = ["pdf", "extraction", "ocr", "markdown", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Every backend imports inside its own extract() call, backend_availability()
# reports a missing one as unavailable, and extract_single_pdf names the extra to
# install when none is present. So the package installs and imports with no
# extraction library at all, and each user pays only for the backends they pick.
# `pip install pdf-extractor[cpu]` is the ordinary choice.
dependencies = []

[project.optional-dependencies]
# Pure-Python and small-wheel backends. No GPU, no model downloads.
cpu = [
    # markitdown's magika/onnxruntime chain has no cp314 artifact yet.
    "markitdown>=0.1.0; python_version < '3.14'",
    "pdfplumber>=0.10.0",
    # pdfplumber pulls Pillow transitively; keep the optional CPU graph above
    # the first release that fixes all advisories known at this release gate.
    "pillow>=12.3.0",
    "pdfminer.six>=20221105",
    # The CLI backend id remains `pypdf2` for compatibility, but PyPDF2 is
    # retired and has no patched release for its known advisory.
    "pypdf>=6.0.0",
]
gpu = [
    # docling's macOS standard model stack still pins an advisory-affected
    # transformers 4.x. Keep the published extra safe until upstream lifts it.
    "docling>=2.94.0; sys_platform != 'darwin'",
    # marker-pdf is intentionally not selected: its supported-platform
    # dependency graph pins Pillow below the first fully patched release.
]
llm = ["pymupdf4llm>=0.0.1"]
# extractors.py falls back to a no-op progress bar when tqdm is absent.
progress = ["tqdm>=4.60.0"]
all = ["pdf-extractor[cpu,gpu,llm,progress]"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.8.0"]

[project.urls]
Homepage = "https://github.com/ahundt/autorun"
Repository = "https://github.com/ahundt/autorun.git"
Issues = "https://github.com/ahundt/autorun/issues"

[project.scripts]
extract-pdfs = "pdf_extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# cli.py has intentional late imports for standalone script execution support
"src/pdf_extraction/cli.py" = ["E402"]
